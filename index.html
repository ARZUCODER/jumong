<!DOCTYPE html>
<html lang="uz">
<head>
    <!-- iPhone ekranida qulay joylashishi va yaqinlashtirishni (zoom) cheklash -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Jumong Seriali - Barcha qismlar</title>
    <style>
        /* Umumiy sozlamalar */
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; /* Apple shriftlari */
            margin: 0;
            padding: 20px 15px;
            /* iPhone'ning tepa qismi (notch) uchun himoya */
            padding-top: env(safe-area-inset-top, 20px);
            padding-bottom: env(safe-area-inset-bottom, 20px);
            text-align: center;
        }

        h1 {
            color: #e50914; 
            margin-bottom: 5px;
            font-size: 28px;
        }

        h3 {
            color: #aaaaaa;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 16px;
        }

        /* Video pleer */
        .video-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            background: #000;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            /* Aspekt nisbatini saqlash (16:9) */
            aspect-ratio: 16 / 9; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%;
            outline: none;
            object-fit: cover;
        }

        /* Playlist (Qismlar) qutisi */
        .playlist-container {
            max-width: 900px;
            margin: 20px auto;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-height: 350px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch; /* iPhone uchun silliq skroll */
        }

        .playlist {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px;
        }

        /* Telefon uchun qulay tugmalar */
        .episode-btn {
            background-color: #2b2b2b;
            color: #fff;
            border: none;
            padding: 15px 5px; /* Barmoq bilan bosish qulay bo'lishi uchun kattalashtirildi */
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent; /* iPhone'da tugma bosilganda chiqadigan ko'k fonni olib tashlash */
        }

        /* Bosilganda (Touch) effekt */
        .episode-btn:active {
            transform: scale(0.92);
            background-color: #444;
        }

        .episode-btn.active {
            background-color: #e50914;
            color: #fff;
            box-shadow: 0 0 10px rgba(229, 9, 20, 0.6);
        }

        /* Skrollbar (Telefonda odatda yashirin turadi, PC uchun dizayn) */
        .playlist-container::-webkit-scrollbar { width: 6px; }
        .playlist-container::-webkit-scrollbar-track { background: transparent; }
        .playlist-container::-webkit-scrollbar-thumb { background: #555; border-radius: 10px; }

        /* Kichik ekranli telefonlar uchun moslashuv */
        @media (max-width: 480px) {
            h1 { font-size: 24px; }
            .playlist-container {
                max-height: 250px; /* Ekranda video ko'rinib turishi uchun ro'yxatni kaltalashtiramiz */
            }
            .playlist {
                grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
                gap: 8px;
            }
            .episode-btn {
                padding: 12px 2px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <h1>Jumong</h1>
    <h3 id="currentTitle">1-Qism</h3>

    <!-- Video Pleer -->
    <div class="video-container">
        <!-- 
           iPhone safari uchun maxsus parametrlar:
           playsinline, webkit-playsinline - Video boshlanganda majburiy Fullscreenga o'tib ketmaydi, sayt ichida ko'rsatadi
        -->
        <video id="videoPlayer" controls playsinline webkit-playsinline preload="metadata">
            Sizning brauzeringiz video formatini qo'llab-quvvatlamaydi.
        </video>
    </div>

    <!-- Qismlar tugmalari -->
    <div class="playlist-container">
        <div class="playlist" id="playlist">
            <!-- JS orqali to'ldiriladi -->
        </div>
    </div>

    <script>
        const totalEpisodes = 81;
        const videoPlayer = document.getElementById('videoPlayer');
        const currentTitle = document.getElementById('currentTitle');
        const playlist = document.getElementById('playlist');
        
        let currentIndex = 1;

        function buildPlaylist() {
            for (let i = 1; i <= totalEpisodes; i++) {
                const btn = document.createElement('button');
                btn.className = 'episode-btn';
                btn.id = 'btn-' + i;
                btn.innerText = i + '-Qism';
                
                btn.onclick = () => playEpisode(i);
                
                playlist.appendChild(btn);
            }
        }

        function playEpisode(index) {
            currentIndex = index;
            
            // Videoni almashtirish
            videoPlayer.src = `https://c.uzbeklar.biz/film9/jumong/jumong%20${index}-qism%20hd%20%28uzmedia.tv%29.mp4`;
            videoPlayer.play().catch(error => {
                console.log("Avtoplay iPhone tomondan bloklandi. Iltimos, Play tugmasini bosing.");
            });
            
            currentTitle.innerText = index + '-Qism';

            // Aktiv tugmani yangilash
            document.querySelectorAll('.episode-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            const activeBtn = document.getElementById('btn-' + index);
            if (activeBtn) {
                activeBtn.classList.add('active');
                
                // Telefonlarda ro'yxatni silliq aylantirib, tanlangan tugmani ko'rsatish
                activeBtn.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            
            // Telefon ekranida pleerga qarab tepaga silliq skroll qilish
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Keyingi qismga o'tish
        videoPlayer.addEventListener('ended', () => {
            if (currentIndex < totalEpisodes) {
                playEpisode(currentIndex + 1);
            }
        });

        // Boshlang'ich holat
        window.onload = () => {
            buildPlaylist();
            videoPlayer.src = `https://c.uzbeklar.biz/film9/jumong/jumong%201-qism%20hd%20%28uzmedia.tv%29.mp4`;
            document.getElementById('btn-1').classList.add('active');
        };
    </script>

</body>
</html>
